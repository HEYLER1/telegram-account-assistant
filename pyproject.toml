[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asistente-telegram"
version = "0.2.0"
description = "Asistente para buscar, consultar y administrar tu cuenta de Telegram"
requires-python = ">=3.11"
dependencies = ["telethon>=1.44,<2", "mcp>=1.12,<2", "python-dotenv>=1,<2", "pypdf>=5,<7", "qrcode>=8,<9"]

[project.optional-dependencies]
audio = ["faster-whisper>=1.1,<2"]

[project.scripts]
telegram-asistente = "telegram_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["telegram_assistant*"]
